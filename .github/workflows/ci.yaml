name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Cache bazel
        uses: actions/cache@v5
        env:
          cache-name: bazel-cache
        with:
          path: |
            ~/.cache/bazelisk
            ~/.cache/bazel
          key: ${{ runner.os }}-${{ env.cache-name }}

      - uses: actions/checkout@v6

      - name: Build the code
        run: cd src && bazelisk build //...

      - name: Run the tests
        run: cd src && bazelisk test //...
